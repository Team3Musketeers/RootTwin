# Data infrastructure for the 3D factory digital twin (task T04 - Person B)
# Start everything:   docker compose up -d
# Stop:               docker compose down        (add -v to also delete the data)

name: factory-twin

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: twin-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"     # MQTT (simulation, ingestor, enterprise connectors)
      - "${MQTT_WS_PORT:-9001}:9001"  # MQTT over WebSocket (browser / 3D frontend if needed)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: twin-timescaledb
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # host 5433: avoids clashing with a local PostgreSQL
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twin}
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin_dev_password}
    volumes:
      - ./infra/timescaledb/init:/docker-entrypoint-initdb.d:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    container_name: twin-ingestor
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: "factory/#"
      DATABASE_URL: postgresql://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin_dev_password}@timescaledb:5432/${POSTGRES_DB:-twin}
      FLUSH_INTERVAL_S: "1.0"
      BATCH_SIZE: "500"
      LOG_LEVEL: INFO
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # Command relay HTTP -> MQTT (T33). Swagger: http://localhost:8001/docs
  # Person C's main API can mount roottwin.command_api.router instead.
  command-api:
    build:
      context: .
      dockerfile: services/command_api/Dockerfile
    container_name: twin-command-api
    ports:
      - "${COMMAND_API_PORT:-8001}:8001"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # Main API + 3D front-end: http://localhost:8000  (Swagger: /docs)
  api:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    image: roottwin-app
    container_name: twin-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MQTT_HOST: mosquitto
      DATABASE_URL: postgresql://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-twin_dev_password}@timescaledb:5432/${POSTGRES_DB:-twin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./models:/app/models:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # Production line (stand-in for Person A's simulation until it exists)
  line:
    image: roottwin-app
    container_name: twin-line
    # add "--random-faults" for wear-driven breakdowns; off by default so the demo is controlled from the UI
    command: ["python", "scripts/run_line.py", "--start"]
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Live detector: telemetry -> explained alarms
  detector:
    image: roottwin-app
    container_name: twin-detector
    command: ["python", "-m", "roottwin.live_detector"]
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # T26 enterprise mode: the twin as an OPC UA server (SCADA / MES / PLC / Factory I/O connect to opc.tcp://localhost:4840/roottwin/)
  opcua:
    image: roottwin-app
    container_name: twin-opcua
    command: ["python", "-m", "roottwin.enterprise.opcua_server"]
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "${OPCUA_PORT:-4840}:4840"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # T26 real data in (OPC UA PLC nodes / MQTT topics mapped in config/enterprise.yaml): docker compose --profile enterprise up -d connector
  connector:
    image: roottwin-app
    container_name: twin-connector
    profiles: ["enterprise"]
    command: ["python", "-m", "roottwin.enterprise.connector"]
    environment:
      MQTT_HOST: mosquitto
    volumes:
      - ./config:/app/config:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # T25 experiment tracking (optional): docker compose --profile mlops up -d mlflow ; then MLFLOW_TRACKING_URI=http://localhost:5000
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: twin-mlflow
    profiles: ["mlops"]
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

volumes:
  mlflow-data:
  mosquitto-data:
  mosquitto-log:
  timescale-data:
