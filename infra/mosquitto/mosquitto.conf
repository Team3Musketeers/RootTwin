# Mosquitto 2.x configuration - DEVELOPMENT ONLY
# Anonymous access is allowed so the team can work without credentials.
# Before any real-machine / enterprise use: set allow_anonymous false,
# add a password_file and enable TLS (see README "Next steps").

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT
listener 1883
protocol mqtt

# MQTT over WebSocket (browser clients)
listener 9001
protocol websockets

allow_anonymous true
