[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roottwin"
version = "0.2.0"
description = "3D factory digital twin: fault detection, diagnosis and AI-guided repair"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",                  # uvicorn needs it for WS /ws
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["torch>=2.4", "shap>=0.46"]      # T16/T20 deep models, T22 SHAP (CPU torch: --index-url https://download.pytorch.org/whl/cpu)
llm = ["anthropic>=2.12"]               # T24 copilot LLM mode (offline extractive mode needs nothing)
dev = ["pytest>=8", "httpx>=0.27", "jupyter", "seaborn", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
include = ["roottwin*"]

[tool.setuptools.package-data]
"roottwin.faults" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
