# Correct diagnosis: root cause #1 = M2 CONVEYOR_JAM, #2 = M5 OVERHEATING.
scenario_id: CASCADE-JAM-OVERHEAT
description: "Jam on M2 propagates downstream, then independent overheating on M5"
seed: 11
